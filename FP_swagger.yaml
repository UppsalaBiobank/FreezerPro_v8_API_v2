---
openapi: 3.0.1
info:
  title: FreezerPro API V2
  version: v2
components:
  securitySchemes:
    api_key:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    auth_out:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              default: '1'
            type:
              type: string
              default: authentication
            attributes:
              type: object
              properties:
                token:
                  type: string
                  default: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoxLCJleHAiOjE2NzUwOTA1OTJ9.QbyNhqjQFw2CKppn2JQ4k3SAQ9kBfep77GALLukQwxA
                exp:
                  type: string
                  default: '2023-01-30T14:56:32.307Z'
                username:
                  type: string
                  default: username
    auth_in:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - username
      - password
    udf_definition:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
    udf_definitions:
      type: array
      items:
        "$ref": "#/components/schemas/udf_definition"
    audit_record:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              default: '1'
            type:
              type: string
              default: audit_record
            attributes:
              type: object
              properties:
                message:
                  type: string
                  example: 'Box ''Box 1 (9000000298)'' moved: Old Location: ''Freezer
                    3->Level 1->Box 1''. New Location: ''Freezer 2->Box 1'''
                comment:
                  type: string
                  example: Box moved to make space
                created_at:
                  type: string
                  example: '2020-01-01T00:00:00.000Z'
                user:
                  type: string
                  nullable: true
                  example: Alice Andrews
    audit_records:
      type: object
      properties:
