paths:
  "/api/v2/auth/login":
    post:
      summary: Authenticate
      tags:
      - Login
      parameters: []
      responses:
        '200':
          description: authorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/auth_out"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/unauthorized"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/auth_in"
  "/api/v2/audit_records":
    get:
      summary: Get Audit Records
      tags:
      - Audit Records
      security:
      - api_key: []
      description: "Filtering supported using the following operators: <b>eq, neq,
        cont, gt, lt</b>\n      </br></br>\n      <b>Searchable Attributes:</b> <ul><li><i>Standard
        Fields</i>: comment, creation_date, obj_id, obj_type</li></ul>\n      </br></br>\n
        \     Examples:\n      <ul>\n      <li>/api/v2/audit_records?filter[obj_type_eq]=User&filter[obj_id_eq]=41</li>\n
        \     <li>/api/v2/audit_records?filter[creation_date_gt]=06/23/2022</li>\n
        \     </ul>\n      "
      responses:
        '200':
          description: no audit_records existing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/audit_record/properties/data"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authorization_error"
        '403':
          description: no rights
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/restricted_access"
  "/api/v2/audit_records/{id}":
    parameters:
    - name: id
      in: path
      description: Audit Record id
      required: true
      schema:
        type: integer
    get:
      summary: Get Audit Record
      tags:
      - Audit Records
      security:
      - api_key: []
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/audit_record"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authorization_error"
        '403':
          description: no rights
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/invalid_rights"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/record_not_found"
  "/api/v2/boxes":
    get:
      summary: Get Boxes
      tags:
      - Box
      security:
      - api_key: []
      description: "Filtering supported using the following operators: <b>eq, neq,
        cont, gt, lt</b>\n      </br></br>\n      <b>Searchable Attributes:</b> <ul><li><i>Standard
        Fields</i>: available_cells, barcode, description, id, name, samples</li><li><i>Relation
        box_type</i>: box_type_description, box_type_id, box_type_name</li><li><i>Relation
        vial</i>: vial_barcode, vial_last_updated, vial_out_of_freezer, vial_rfid,
        vial_taken_out_by, vial_taken_out_on, vial_volume, vial_workflow_state</li><li><i>Relation
        owner</i>: owner_fullname, owner_id, owner_username</li><li><i>User Defined
        Fields</i>: udf_UdfName</li></ul>\n      </br></br>\n      Examples:\n      <ul>\n
        \     <li>/api/v2/boxes?filter[name_cont]=Adv</li>\n      <li>/api/v2/boxes?filter[barcode_eq]=9000000004</li>\n
        \     <li>/api/v2/boxes?filter[available_cells_eq]=90</li>\n      <li>/api/v2/boxes?filter[udf_Link
        to Website_eq]=freezerpro.com\n      </ul>\n      "
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/boxes"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/unauthorized"
        '403':
          description: no rights
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/invalid_rights"
    post:
      summary: Create Box
      tags:
      - Box
      security:
      - api_key: []
      parameters: []
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/box"
        '400':
          description: not permitted params
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/invalid_params"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/unauthorized"
        '403':
          description: no rights
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/invalid_rights"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Box 200
                description:
                  type: string
                  example: A box
                box_type_id:
                  type: integer
                  example: 50
                container_id:
                  type: integer
                  example: 201
                udfs:
                  type: array
                  items:
                    "$ref": "#/components/schemas/udf/properties/data/properties/attributes"
              required:
              - name
              - box_type_id
              - container_id
  "/api/v2/boxes/{id}":
    get:
      summary: Retrieve Box
      tags:
      - Box
      security:
      - api_key: []
      description: "Boxes can be returned including the following objects: \n      <ul>\n
        \     <li>UDFs: /api/v2/boxes/{id}/?include=udfs</li>\n      <li>Box Type:
        /api/v2/boxes/{id}/?include=box_type</li>\n      <li>Vials: /api/v2/boxes/{id}/?include=vials</li>\n
        \     <li>Parents (containers): /api/v2/boxes/{id}/?include=parents</li>\n
        \     <li>One parent at a time: /api/v2/boxes/{id}/?include=container.parent</li>\n
        \     </ul>\n      "
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Box found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/box"
        '404':
          description: Box not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/record_not_found"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/unauthorized"
    patch:
      summary: Update Box
      tags:
      - Box
      security:
      - api_key: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/box"
        '400':
          description: not permitted params
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/invalid_params"
        '404':
          description: box not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/record_not_found"
        '401':
          description: unauthorized before editing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/unauthorized"
        '403':
          description: no rights
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/invalid_rights"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                box:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Updated box name
                    description:
                      type: string
                      example: Updated description
                    barcode_tag:
                      type: string
                      example: Updated barcode
                    udfs:
                      type: array
                      items:
                        "$ref": "#/components/schemas/udf/properties/data/properties/attributes"
    delete:
      summary: Delete Box
      tags:
      - Box
      security:
      - api_key: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: successful
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/unauthorized"
        '404':
          description: Box not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/record_not_found"
