  "/api/v2/vials":
    get:
      summary: Get Vials
      tags:
      - Vial
      security:
      - api_key: []
      description: "Filtering supported using the following operators: <b>eq, neq,
        cont, gt, lt</b>\n      </br></br>\n      <b>Searchable Attributes:</b> <ul><li><i>Standard
        Fields</i>: barcode, last_updated, out_of_freezer, rfid, taken_out_by, taken_out_on,
        volume, workflow_state</li><li><i>Relation box</i>: box_available_cells, box_barcode,
        box_description, box_id, box_name, box_samples, box_udf_UdfName</li><li><i>Relation
        sample</i>: sample_description, sample_expiration, sample_id, sample_last_updated,
        sample_name, sample_vials_count, sample_volume, sample_udf_UdfName</li><li><i>Relation
        sample_group</i>: sample_group_description, sample_group_id, sample_group_name</li><li><i>Relation
        sample_owner</i>: sample_owner_fullname, sample_owner_id, sample_owner_username</li><li><i>Relation
        sample_type</i>: sample_type_description, sample_type_id, sample_type_name</li><li><i>Relation
        sample_source</i>: sample_source_created, sample_source_description, sample_source_id,
        sample_source_last_updated, sample_source_name, sample_source_udf_UdfName</li></ul>\n
        \     </br></br>\n      Examples:\n      <ul>\n      <li>/api/v2/vials?filter[barcode_eq]=1000016</li>\n
        \     <li>/api/v2/vials?filter[out_of_freezer_eq]=true</li>\n      <li>/api/v2/vials?filter[taken_out_by_eq]=admin</li>\n
        \     <li>/api/v2/vials?filter[volume_lt]=99</li>\n      <li>/api/v2/vials?filter[workflow_state_eq]=State
        1</li>\n      <li>/api/v2/vials?filter[sample_name_eq]=AdvSearchSample</li>\n
        \     <li>/api/v2/vials?filter[sample_group_name_neq]=SampleGroup Test</li>\n
        \     <li>/api/v2/vials?filter[box_name_eq]=Box 1;filter[sample_name_eq]=AdvSearchSample</li>\n
        \     </ul>\n      "
      responses:
        '200':
          description: get all vials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/vials"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authorization_error"
        '403':
          description: no rights to view all samples locations
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/invalid_rights"
    post:
      summary: Create Vial
      tags:
      - Vial
      security:
      - api_key: []
      parameters: []
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/vial"
        '400':
          description: params missing
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/invalid_params"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/authorization_error"
        '403':
          description: no rights to work with samples
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/invalid_rights"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vial:
                  type: object
                  properties:
                    sample_id:
                      type: integer
                      default: 1
                    box_id:
                      type: integer
                      default: 1
                    position:
                      type: integer
                      default: 25
                    volume:
                      type: number
                      default: 3.0
                  required:
                  - sample_id
                  - box_id
                  - position
