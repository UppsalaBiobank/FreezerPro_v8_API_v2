        \     Examples:\n      <ul>\n      <li>/api/v2/clinical_tests?filter[sample_source_eq]=Sample
        Source Test</li>\n      <li>/api/v2/clinical_tests?filter[test_type_eq]=Test
        1</li>\n      <li>/api/v2/clinical_tests?filter[created_by_eq]=Administrator</li>\n
        \     <li>/api/v2/clinical_tests?filter[udf_Cap Label_eq]=CapLabel2;filter[udf_Vial
